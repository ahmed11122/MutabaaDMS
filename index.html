<script>
/* v36 theme: mode = system | light | dark (saved on this PC); data-theme is always the resolved value */
(function(){var mq=window.matchMedia("(prefers-color-scheme: dark)");
function mode(){try{var m=localStorage.getItem("mtbTheme");return m==="dark"||m==="light"?m:"system"}catch(e){return"system"}}
function resolve(){var m=mode();return m==="system"?(mq.matches?"dark":"light"):m}
function paint(){document.documentElement.setAttribute("data-theme",resolve())}
paint();
(mq.addEventListener?mq.addEventListener("change",function(){if(mode()==="system")paint()}):mq.addListener&&mq.addListener(function(){if(mode()==="system")paint()}));
window.themeMode=mode;
window.setThemeMode=function(m){m=m==="dark"||m==="light"?m:"system";try{m==="system"?localStorage.removeItem("mtbTheme"):localStorage.setItem("mtbTheme",m)}catch(e){}
 try{window.dmsNative&&window.dmsNative.themeSet&&window.dmsNative.themeSet(m)}catch(e){}paint();return m};
window.themeNow=resolve;
function ap(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function apPaint(){var r=document.documentElement;r.setAttribute("data-accent",ap("mtbAccent","blue"));r.setAttribute("data-size",ap("mtbSize","m"))}
apPaint();
window.apGet=ap;
window.apSet=function(k,v){try{v==="blue"&&k==="mtbAccent"||v==="m"&&k==="mtbSize"?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}apPaint()};
addEventListener("DOMContentLoaded",function(){try{window.dmsNative&&window.dmsNative.themeSet&&window.dmsNative.themeSet(mode())}catch(e){}});})();
</script>

 else body=[["Sara","opened"],["Sara","saved v3"],["Omar","saved v2"]].map(([u,a],k)=>`<div class="li">${u} · ${a}<div class="mu">${ago(i.m+k*90+2)}</div></div>`).join("");
 p.innerHTML=`<div class="ic ${i.t}">${{docx:"W",xlsx:"X",pdf:"P",folder:""}[i.t]}</div><h3>${esc(i.n)}</h3><div class="tabs">${tabs}</div>${body}`;
 p.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t){S.tab=+b.dataset.t;pane();return}
  const a=b.dataset.a;
  if(a==="op"){if(i.l&&!mine)toast(`${t("lb")} ${i.l}`);else{i.l=S.u;toast("myapp://edit/"+i.id);list();pane();nav()}}

}

window.add=async a=>{

 const k=D.filter(i=>live(i)&&i.p===cur()&&i.t==="folder").length+1;
 try{await addDoc(collection(db,"files"),{name:`${t("fo")} ${k}`,folderId:fidOf(cur()),type:"folder",ownerId:uid(),createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}catch(e){fail(e)}
};
function newOffice(x){
 const word=x==="docx",def=word?L("New document","مستند جديد"):L("New spreadsheet","جدول جديد");
 const m=modal(`<h3>${word?t("wd"):t("xl")}</h3><label class="kv"><span>${t("nm")}</span><input id="nn" value="${def}" maxlength="120" dir="auto"></label><div class="msg" id="me"></div><div class="mbt"><button class="btn s" id="mc">${L("Cancel","إلغاء")}</button><button class="btn" id="mg">${L("Create","إنشاء")}</button></div>`);
 const inp=m.q("#nn"),me=m.q("#me");inp.focus();inp.select();
 m.q("#mc").onclick=m.close;
 const go=async()=>{
  let n=inp.value.replace(/[\\/:*?"<>|]/g,"_").trim().replace(new RegExp("\\."+x+"$","i"),"");
  if(!n){me.textContent=L("Enter a name","اكتب اسماً");me.className="msg e";return}
  const used=new Set(D.filter(i=>live(i)&&i.p===cur()&&i.t!=="folder").map(i=>String(i.n).toLowerCase()));
  let name=n+"."+x,k=2;while(used.has(name.toLowerCase()))name=`${n} (${k++}).${x}`;
  m.q("#mg").disabled=true;
  try{
   const bytes=b64(BLANK[x]);
   const r=await addDoc(collection(db,"files"),{name,folderId:fidOf(cur()),type:x,size:bytes.length,status:"draft",currentVersion:1,ownerId:uid(),ownerName:S.u,lockedBy:null,lockedByName:null,lockExpiresAt:null,storagePath:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
   const path=`files/${r.id}/v1`;
   await uploadBytes(sref(storage,path),bytes);
   await updateDoc(r,{storagePath:path});
   await setDoc(doc(db,"files",r.id,"versions","1"),{storagePath:path,size:bytes.length,createdBy:uid(),createdByName:S.u,createdAt:serverTimestamp()});
   logAct(r.id,"created","v1");m.close();toast(L("Created: ","تم الإنشاء: ")+name);
  }catch(err){m.q("#mg").disabled=false;m.close();fail(err)}
 };
 m.q("#mg").onclick=go;inp.onkeydown=ev=>{if(ev.key==="Enter")go()};
}

async function upload(e){
 const list_=[...e.target.files];e.target.value="";
 for(const f of list_){
  const x=f.name.split(".").pop().toLowerCase();
  if(!["docx","xlsx","pdf"].includes(x)){toast(ar()?"الأنواع المسموحة: Word وExcel وPDF":"Only Word, Excel and PDF files");continue}
  try{
   const r=await addDoc(collection(db,"files"),{name:f.name,folderId:fidOf(cur()),type:x,size:f.size,status:"draft",currentVersion:1,ownerId:uid(),ownerName:S.u,lockedBy:null,lockedByName:null,lockExpiresAt:null,storagePath:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
   const path=`files/${r.id}/v1`;
   await uploadBytes(sref(storage,path),f);
   await updateDoc(r,{storagePath:path});
   await setDoc(doc(db,"files",r.id,"versions","1"),{storagePath:path,size:f.size,createdBy:uid(),createdByName:S.u,createdAt:serverTimestamp()});
   logAct(r.id,"uploaded","v1");toast(f.name)
  }catch(err){fail(err)}
 }
}

/* ---- edit lock: atomic (transaction), per app-session, safe against two people or two PCs ---- */
const SID=(self.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();
let SIDOK=true;   // falls back to the old fields only if Firestore rules reject the new lockSid field
const dlog=m=>{try{window.dmsNative&&window.dmsNative.log&&window.dmsNative.log(m)}catch(e){}};
const clrLock=()=>({lockedBy:null,lockedByName:null,lockExpiresAt:null,...(SIDOK?{lockSid:null}:{})});
const mine=x=>x.lockedBy===uid()&&(!x.lockSid||x.lockSid===SID);   // old locks without lockSid still count as ours
const lockTx=r=>runTransaction(db,async tx=>{
 const x=(await tx.get(r)).data()||{},now=Date.now(),ex=x.lockExpiresAt?.toMillis?.()??0;
 if(x.lockedBy&&ex>now&&!mine(x)){
  const e=new Error(x.lockedBy===uid()?L("Already open on another PC or window","مفتوح على جهاز أو نافذة أخرى"):`${t("lb")} ${x.lockedByName}`);
  e.lost=true;throw e}
 tx.update(r,{lockedBy:uid(),lockedByName:S.u,lockExpiresAt:Timestamp.fromMillis(now+600000),...(SIDOK?{lockSid:SID}:{}),updatedAt:serverTimestamp()})
});
async function lock(r){   // acquire or renew; throws (e.lost=true) when somebody else holds it
 try{return await lockTx(r)}
 catch(e){
  if(e.code==="permission-denied"&&SIDOK){SIDOK=false;dlog("lockSid rejected by Firestore rules - falling back to basic lock");return lockTx(r)}
  throw e}
}
const unlockTx=r=>runTransaction(db,async tx=>{   // only clears a lock that is still ours
 const x=(await tx.get(r)).data()||{};
 if(x.lockedBy&&!mine(x))return false;
 tx.update(r,{...clrLock(),updatedAt:serverTimestamp()});return true
});
async function releaseLock(r,id){   // retries; never reports success unless Firestore confirmed
 for(let k=0;k<8;k++){
  if(id&&NS.has(id))return true;   // the file was re-opened meanwhile, keep the new lock
  try{await unlockTx(r);dlog("unlock ok "+r.id);return true}
  catch(e){
   if(e.code==="permission-denied"&&SIDOK){SIDOK=false;continue}
   dlog("unlock FAILED try "+(k+1)+": "+(e.code||"")+" "+(e.message||e));
   await new Promise(z=>setTimeout(z,Math.min(2000*(k+1),15000)))}
 }
 return false
}
const upd=(r,o)=>updateDoc(r,{...o,updatedAt:serverTimestamp()});

/* ---- Desktop app bridge: open in Word/Excel, save = new version ---- */
const NS=new Map();
async function pushVersion(s,bytes){
 const id=s.r.id;
 let cur=0,wasAp=false;
 try{const dd=(await getDoc(s.r)).data();cur=dd?.currentVersion||0;wasAp=dd?.status==="approved";if(cur>(s.cv||0)){toast(ar()?"تنبيه: حفظ شخص آخر نسخة أحدث أثناء تعديلك. نسختك أصبحت الأحدث والقديمة محفوظة في السجل":"Heads-up: someone saved a newer version while you were editing. Yours is now the latest; theirs is kept in history.")}}catch(e){}
 const next=Math.max(0,s.cv||0,s.tried||0,cur)+1;   // v33: no longer reads every version document on each save
 s.tried=next;
 const p=`files/${id}/${next}`;
 await uploadBytes(sref(storage,p),bytes);
 await setDoc(doc(db,"files",id,"versions",String(next)),{storagePath:p,size:bytes.length,createdBy:uid(),createdByName:S.u,createdAt:serverTimestamp()});
 await upd(s.r,{storagePath:p,currentVersion:next,size:bytes.length,...(wasAp?{status:"submitted"}:{})});
 s.cv=next;
 logAct(id,"saved","v"+next);
}
const IDLE_MS=20*60000;   // no save for this long -> stop extending the lock (it then expires 10 min later)
const OPENING=new Set();
async function beat(id){
 const s=NS.get(id);if(!s||s.beating)return;
 if(Date.now()-s.last>IDLE_MS){
  if(!s.idle){s.idle=true;dlog("idle, lock no longer extended "+id);toast(ar()?"لم يتم حفظ أي تعديل منذ 20 دقيقة. سيُفك القفل بعد 10 دقائق إلا إذا حفظت الملف":"No save for 20 minutes. The lock will be released in 10 minutes unless you save the file.",9000)}
  return}
 s.beating=true;
 try{await lock(s.r)}
 catch(e){
  if(e.lost){clearInterval(s.hb);s.hbLost=true;dlog("LOCK LOST "+id+": "+e.message);toast(ar()?"تنبيه: فقدت قفل هذا الملف وأصبح شخص آخر يعدّله. احفظ نسختك وتحقق من السجل":"Warning: you lost the lock on this file and someone else may be editing it. Save your copy and check the history.",12000)}
  else dlog("heartbeat error "+id+": "+(e.code||"")+" "+(e.message||e))}
 finally{s.beating=false}
}
async function nativeEdit(i,r){
 if(OPENING.has(i.fid))return;
 OPENING.add(i.fid);
 try{
  if(NS.has(i.fid)){await window.dmsNative.open({id:i.fid,name:i.n,bytes:new Uint8Array(0)});return}
  const url=await getDownloadURL(sref(storage,await latestPath(i)));
  const cv=(await getDoc(r)).data()?.currentVersion||0;
  await window.dmsNative.open({id:i.fid,name:i.n,url,cv});
  NS.set(i.fid,{r,cv,q:Promise.resolve(),last:Date.now(),hb:setInterval(()=>beat(i.fid),240000)});

async function checkPending(){

 let list=[];try{list=await window.dmsNative.pending()}catch(e){return}
 for(const p of list){
  const r=doc(db,"files",p.id);let snap=null,cur=0;
  try{snap=await getDoc(r);cur=snap.exists()?(snap.data().currentVersion||0):0}catch(e){}
  const exists=!!(snap&&snap.exists());
  await new Promise(done=>{
   const when=new Date(p.time).toLocaleString();
   const warn=!exists?L("This file no longer exists on the server.","هذا الملف لم يعد موجوداً على الخادم."):cur>(p.cv||0)?L("Someone saved a newer version since. Yours will be added as the newest; theirs stays in history.","قام شخص بحفظ نسخة أحدث. ستُضاف نسختك كأحدث نسخة وتبقى الأخرى في السجل."):"";
   const m=modal(`<h3>${L("Unsaved changes found","تم العثور على تعديلات غير محفوظة")}</h3><p>${L("These changes were not uploaded:","لم يتم رفع هذه التعديلات:")}</p><div class="nmb" dir="auto">${esc(p.name)}</div><p>${esc(when)} · ${Math.round((p.size||0)/1024)} KB</p>${warn?`<p>${warn}</p>`:""}<div class="msg" id="me"></div><div class="mbt"><button class="btn s dg" id="md">${L("Discard","تجاهل")}</button><button class="btn s" id="ms">${L("Save copy to PC","حفظ نسخة على الجهاز")}</button>${exists?`<button class="btn" id="mu">${L("Upload as new version","رفع كنسخة جديدة")}</button>`:""}</div>`,true);
   const me=m.q("#me");
   const fin=()=>{m.close();done()};
   m.q("#ms").onclick=async()=>{try{const f=await window.dmsNative.exportPending(p.id);if(f){await window.dmsNative.discardPending(p.id);toast(L("Saved","تم الحفظ"));fin()}}catch(e){me.textContent=e.message;me.className="msg e"}};
   m.q("#md").onclick=()=>{
    if(!confirm(L("Discard these changes permanently?","تجاهل هذه التعديلات نهائياً؟")))return;
    window.dmsNative.discardPending(p.id).then(fin)};
   const u=m.q("#mu");if(u)u.onclick=async()=>{
    u.disabled=true;
    try{const b=await window.dmsNative.readPending(p.id);await pushVersion({r,cv:p.cv||0},new Uint8Array(b));await window.dmsNative.saved({id:p.id,hash:p.hash});toast(L("Uploaded as a new version","تم الرفع كنسخة جديدة"));fin()}
    catch(e){u.disabled=false;me.textContent=e.code==="permission-denied"?L("Not allowed","غير مسموح"):e.message;me.className="msg e"}};
  });
 }
}

/* ---- built-in preview: PDF, Word, Excel/CSV, text, images ---- */
const PV_EXT={pdf:"pdf",docx:"docx",doc:"docx",xlsx:"xls",xlsm:"xls",xls:"xls",csv:"xls",txt:"txt",png:"img",jpg:"img",jpeg:"img",gif:"img",webp:"img"};
const extOf=n=>(String(n).split(".").pop()||"").toLowerCase();
const canPreview=i=>i.t!=="folder"&&extOf(i.n)==="pdf";
const LIBS={};
const loadLib=src=>LIBS[src]||(LIBS[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete LIBS[src];rej(new Error("lib"))};document.head.appendChild(s)}));
const CDN="https://cdnjs.cloudflare.com/ajax/libs/";
const PDFJS=CDN+"pdf.js/3.11.174/pdf.min.js",PDFW=CDN+"pdf.js/3.11.174/pdf.worker.min.js",MAMMOTH=CDN+"mammoth/1.6.0/mammoth.browser.min.js",SHEETJS=CDN+"xlsx/0.18.5/xlsx.full.min.js";
const FRAME_CSS="body{font:15px/1.6 system-ui,Segoe UI,Arial,sans-serif;margin:16px;color:#111}p,li,td,th,h1,h2,h3,h4{unicode-bidi:plaintext;text-align:start}img{max-width:100%}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px;vertical-align:top}";
async function fetchBytes(i){
 const url=await getDownloadURL(sref(storage,await latestPath(i)));
 if(window.dmsNative&&window.dmsNative.fetch)return new Uint8Array(await window.dmsNative.fetch(url));
 return new Uint8Array(await getBytes(sref(storage,i.sp)));
}
const frame=html=>{const f=document.createElement("iframe");f.setAttribute("sandbox","");f.srcdoc=`<!doctype html><meta charset="utf-8"><style>${FRAME_CSS}</style><body>${html}</body>`;return f};
const PDFCACHE=new Map();
async function officePdf(i){
 const sp=await latestPath(i),key=i.fid+"|"+sp;
 if(PDFCACHE.has(key))return PDFCACHE.get(key);
 const url=await getDownloadURL(sref(storage,sp));
 const b=new Uint8Array(await window.dmsNative.toPdf({url,name:i.n}));
 PDFCACHE.set(key,b);if(PDFCACHE.size>6)PDFCACHE.delete(PDFCACHE.keys().next().value);
 return b;
}
async function preview(i){
 const kind=PV_EXT[extOf(i.n)];
 if(!kind){toast(L("This file type can't be previewed","لا يمكن معاينة هذا النوع من الملفات"));return}
 const N=window.dmsNative,office=(kind==="docx"||kind==="xls")&&!!(N&&N.toPdf);
 const m=modal(`<div class="er2" style="justify-content:space-between"><h3 dir="auto" style="margin:0;word-break:break-all">${esc(i.n)}</h3><button class="btn s" id="pvx">✕</button></div><div class="pb" id="pb"></div>`);
 m.o.querySelector(".mb").classList.add("pv");
 m.q("#pvx").onclick=m.close;
 const pb=m.q("#pb");
 let raw=null,pdfBytes=null,pdfUrl=null,seq=0;
 const tabsFor=()=>kind==="pdf"?[["native",L("Standard viewer","العارض القياسي")],["compat",L("Compatibility viewer","عارض التوافق")]]:office?[["native",L("Exact view (Word/Excel)","عرض دقيق (Word/Excel)")],["quick",L("Quick view","عرض سريع")]]:[];
 const getRaw=async()=>raw||(raw=await fetchBytes(i));
 const draw=async mode=>{
  const my=++seq;
  pb.innerHTML="";
  const tl=tabsFor();
  if(tl.length){const tb=document.createElement("div");tb.className="tabs";tl.forEach(([k,lbl])=>{const bt=document.createElement("button");bt.textContent=lbl;if(k===mode)bt.classList.add("on");bt.onclick=()=>draw(k);tb.appendChild(bt)});pb.appendChild(tb)}
  const wait=document.createElement("div");wait.innerHTML=`<div class="ibar"><i></i></div><p>${(office&&mode==="native")?L("Preparing the exact view with Word/Excel… this can take a few seconds","جارٍ تجهيز العرض الدقيق بواسطة Word/Excel… قد يستغرق ثوانٍ"):L("Loading preview…","جارٍ تحميل المعاينة…")}</p>`;pb.appendChild(wait);
  const live=()=>m.o.isConnected&&my===seq;
  try{
   if(mode==="native"){
    if(!pdfBytes)pdfBytes=kind==="pdf"?await getRaw():await officePdf(i);
    if(!live())return;
    if(!pdfUrl)pdfUrl=URL.createObjectURL(new Blob([pdfBytes],{type:"application/pdf"}));
    wait.remove();const f=document.createElement("iframe");f.src=pdfUrl;pb.appendChild(f);return;
   }
   if(mode==="compat"){
    if(!pdfBytes)pdfBytes=await getRaw();
    await ensurePdfJs();
    const pdf=await pdfjsLib.getDocument({data:pdfBytes.slice()}).promise,n=Math.min(pdf.numPages,40),dpr=window.devicePixelRatio||1;
    if(!live())return;wait.remove();
    for(let k=1;k<=n;k++){
     if(!live())return;
     const pg=await pdf.getPage(k),w=Math.max(300,pb.clientWidth-30),v0=pg.getViewport({scale:1}),sc=Math.min(2,w/v0.width),v=pg.getViewport({scale:sc*dpr});
     const c=document.createElement("canvas");c.width=v.width;c.height=v.height;c.style.width=(v.width/dpr)+"px";
     pb.appendChild(c);await pg.render({canvasContext:c.getContext("2d"),viewport:v}).promise;
    }
    if(pdf.numPages>n){const p=document.createElement("p");p.textContent=L(`Showing the first ${n} of ${pdf.numPages} pages. Open the file to see everything.`,`عرض أول ${n} من ${pdf.numPages} صفحة. افتح الملف لرؤية الكل.`);pb.appendChild(p)}
    return;
   }
   const bytes=await getRaw();
   if(!live())return;
   if(kind==="docx"){
    await loadLib(MAMMOTH);
    const r=await mammoth.convertToHtml({arrayBuffer:bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength)});
    if(!live())return;wait.remove();pb.appendChild(frame(r.value||"<p>(empty)</p>"));
   }else if(kind==="xls"){
    await loadLib(SHEETJS);
    const wb=XLSX.read(bytes,{type:"array",cellDates:true}),names=wb.SheetNames.slice(0,30);
    if(!live())return;wait.remove();
    const MAXR=500,show=k=>{
     const ws=wb.Sheets[names[k]],ref=ws["!ref"];let note="";
     if(ref){const rg=XLSX.utils.decode_range(ref);if(rg.e.r>MAXR){note=`<p>${L(`Showing the first ${MAXR} rows.`,`عرض أول ${MAXR} صف.`)}</p>`;rg.e.r=MAXR;ws["!ref"]=XLSX.utils.encode_range(rg)}}
     const f=frame(XLSX.utils.sheet_to_html(ws)+note);const old=pb.querySelector("iframe");old?old.replaceWith(f):pb.appendChild(f);
     pb.querySelectorAll(".shtabs button").forEach((bt,x)=>bt.classList.toggle("on",x===k));
    };
    if(names.length>1){const t2=document.createElement("div");t2.className="tabs shtabs";names.forEach((nm,k)=>{const bt=document.createElement("button");bt.textContent=nm;bt.onclick=()=>show(k);t2.appendChild(bt)});pb.appendChild(t2)}
    show(0);
   }else if(kind==="txt"){

/* trusted time: Google's server clock when online; offline the PC clock may never go backwards */
async function trueNow(){
 let srv=0;
 try{const n=window.dmsNative;if(n&&n.serverTime)srv=await n.serverTime()}catch(e){}
 let a=null;try{a=JSON.parse(localStorage.getItem(LIC.ck)||"null")}catch(e){}
 const loc=Date.now(),save=v=>{try{localStorage.setItem(LIC.ck,JSON.stringify(v))}catch(e){}};
 if(srv>0){save({seen:Math.max(srv,(a&&a.seen)||0)});return{now:srv,tamper:false}}
 const seen=(a&&a.seen)||0,tamper=loc<seen-300000;   // PC clock is more than 5 min behind a time we already saw
 const now=Math.max(loc,seen);save({seen:now});
 return{now,tamper};
}

  let x=d.data();

   try{await updateDoc(ref,{activatedAt:serverTimestamp()});d=await getDoc(ref);x=d.data()}catch(e){}

  const r={state,key,customer:x.customer||"",exp,now:T.now,checked:T.now,maxUsers:Number(x.maxUsers||0)};

/* ---- Print Word / Excel / PDF at high resolution ---- */
async function ensurePdfJs(){
 await loadLib(PDFJS);
 if(!pdfjsLib.GlobalWorkerOptions.workerSrc){const w=await(await fetch(PDFW)).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:"text/javascript"}))}
}
const PRINTABLE=["pdf"];
const canPrint=i=>i.t!=="folder"&&!!(window.dmsNative&&window.dmsNative.printBegin)&&PRINTABLE.includes(extOf(i.n));
const PRN=new Map();
async function doPrint(i){
 const N=window.dmsNative,kind=extOf(i.n);
 const m=modal(`<h3>${L("Print","طباعة")}</h3><div class="nmb" dir="auto">${esc(i.n)}</div>
 <div id="pp"><div class="ibar"><i></i></div></div><div class="msg" id="me"></div><div class="mbt"><button class="btn s" id="mc">${L("Cancel","إلغاء")}</button></div>`,true);
 const me=m.q("#me"),pp=m.q("#pp");let stop=false,token=null,stage="download";
 const say=(s,e)=>{me.textContent=s;me.className="msg"+(e?" e":"");if(!e)me.style.cssText="display:block;background:none;padding:0;color:var(--mu)";else me.style.cssText=""};
 m.q("#mc").onclick=()=>{stop=true;m.close();if(token)N.printCancel(token).catch(()=>{})};
 const done=r=>{m.close();if(r.ok&&!r.cancelled){logAct(i.fid,"printed");toast(L("Sent to the printer","تم الإرسال إلى الطابعة"))}else if(!r.ok)toast(L("Printing failed: ","فشلت الطباعة: ")+(r.why||""))};
 const viaImages=async bytes=>{
  stage="pdf reader";await ensurePdfJs();
  stage="open pdf";const pdf=await pdfjsLib.getDocument({data:bytes.slice()}).promise,n=pdf.numPages;
  if(n>150)throw new Error(L("Too many pages to print from here (max 150)","عدد الصفحات كبير (الحد 150)"));
  stage="start job";token=await N.printBegin();
  const dpi=n<=20?400:300;let landscape=false;
  for(let k=1;k<=n;k++){
   if(stop)return;
   pp.innerHTML=`<progress max="${n}" value="${k-1}"></progress>`;say(L(`Preparing page ${k} of ${n}…`,`تجهيز الصفحة ${k} من ${n}…`));
   stage="render page "+k;const pg=await pdf.getPage(k),v1=pg.getViewport({scale:1});
   if(k===1)landscape=v1.width>v1.height;
   const v=pg.getViewport({scale:dpi/72}),c=document.createElement("canvas");c.width=Math.round(v.width);c.height=Math.round(v.height);
   const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
   await pg.render({canvasContext:ctx,viewport:v}).promise;
   const blob=await new Promise(r=>c.toBlob(r,"image/png"));
   stage="send page "+k;await N.printPage({token,index:k,bytes:new Uint8Array(await blob.arrayBuffer())});
   c.width=c.height=0;
  }
  if(stop)return;
  pp.innerHTML=`<div class="ibar"><i></i></div>`;say(L("Opening the print window…","جارٍ فتح نافذة الطباعة…"));
  const tk=token;token=null;
  stage="print window";done(await N.printRun({token:tk,count:n,landscape,name:i.n}));
 };
 (async()=>{
  try{
   say(L("Preparing…","جارٍ التحضير…"));
   let bytes;
   if(kind==="pdf")bytes=await fetchBytes(i);
   else{
    const path=await latestPath(i),key=i.fid+"|"+path;
    bytes=PRN.get(key);
    if(!bytes){
     const url=await getDownloadURL(sref(storage,path));
     say(L("Converting with Word/Excel… the first time can take up to a minute","جارٍ التحويل بواسطة Word/Excel… أول مرة قد تستغرق دقيقة"));
     bytes=new Uint8Array(await N.toPdf({url,name:i.n}));
     PRN.set(key,bytes);if(PRN.size>3)PRN.delete(PRN.keys().next().value);
    }
   }
   if(stop)return;
   try{
    stage="print window";say(L("Opening the print window…","جارٍ فتح نافذة الطباعة…"));
    const r=await N.printPdf({bytes,name:i.n});
    if(stop)return;
    done(r);return;
   }catch(e1){
    if(stop)return;
    console.warn("standard print failed, using image method",e1);
    await viaImages(bytes);
   }
  }catch(e){
   if(token)N.printCancel(token).catch(()=>{});
   if(!m.o.isConnected)return;
   console.error("print failed at",stage,e);
   pp.innerHTML="";
   say(e&&e.message==="lib"?L("Printing needs an internet connection the first time. Try again.","الطباعة تحتاج اتصالاً بالإنترنت في المرة الأولى."):`[${stage}] ${errText(e)}`,1);
   m.q("#mc").textContent=L("Close","إغلاق");
  }
 })();
}

/* ---- real Versions + Activity tabs, and downloads with the real file name ---- */
const UN=new Map();
async function userName(id){
 if(!id)return"—";if(id===uid())return S.u;
 if(UN.has(id))return UN.get(id);
 let n="—";try{const s=await getDoc(doc(db,"users",id));if(s.exists())n=s.data().name||"—"}catch(e){}
 UN.set(id,n);return n;
}
const ACTION_TXT=()=>({opened:L("opened","فتح"),saved:L("saved","حفظ"),uploaded:L("uploaded","رفع"),created:L("created","أنشأ"),renamed:L("renamed to","غيّر الاسم إلى"),moved:L("moved to","نقل إلى"),submitted:L("submitted for review","أرسل للمراجعة"),approved:L("approved","اعتمد"),rejected:L("rejected","رفض"),downloaded:L("downloaded","نزّل"),printed:L("printed","طبع"),converted:L("converted to PDF","حوّل إلى PDF")});
const minsAgo=ts=>{const ms=ts?.toMillis?.();return ms?(Date.now()-ms)/60000:0};
async function loadTab(i,tab,box){
 const stale=()=>!box.isConnected||S.sel!==i.id||S.tab!==tab;
 try{
  if(tab===1){
   const [fd,vs]=await Promise.all([getDoc(doc(db,"files",i.fid)),getDocs(collection(db,"files",i.fid,"versions"))]);
   if(stale())return;
   const cv=fd.data()?.currentVersion||0;
   const rows=vs.docs.map(d=>({n:parseInt(d.id,10)||0,...d.data()})).sort((a,b)=>b.n-a.n);
   const names=await Promise.all(rows.map(v=>v.createdByName?Promise.resolve(v.createdByName):userName(v.createdBy)));
   if(stale())return;
   box.className="";
   box.innerHTML=rows.map((v,k)=>`<div class="li"><b>v${v.n}</b>${v.n===cv?` <span class="tag approved">${t("cur")}</span>`:""}<div class="mu">${esc(names[k])} · ${ago(minsAgo(v.createdAt))} · ${fs(v.size)}</div><button class="btn s" data-a="dv" data-v="${v.n}" data-sp="${esc(v.storagePath||"")}">${t("dl")}</button></div>`).join("")||`<div class="empty">—</div>`;
  }else{
   const ds=(await getDocs(query(collection(db,"files",i.fid,"activity"),orderBy("createdAt","desc"),limit(40)))).docs;
   if(stale())return;
   const A=ACTION_TXT();
   box.className="";
   box.innerHTML=ds.map(d=>{const x=d.data();return`<div class="li">${esc(x.byName||"—")} · ${A[x.action]||esc(x.action)}${x.detail?` ${esc(x.detail)}`:""}<div class="mu">${ago(minsAgo(x.createdAt))}</div></div>`}).join("")||`<div class="empty">${L("No activity yet","لا يوجد نشاط بعد")}</div>`;
  }
 }catch(e){if(!stale())box.textContent=e.code==="permission-denied"?L("Not allowed (check Firestore rules)","غير مسموح (تحقق من قواعد Firestore)"):errText(e)}
}
async function downloadFile(i,path,name){
 if(!path){toast(ar()?"الملف قيد الرفع":"File is still uploading");return}
 const url=await getDownloadURL(sref(storage,path)),N=window.dmsNative;
 if(N&&N.fetch&&N.saveAs){
  try{
   const bytes=await N.fetch(url);
   const f=await N.saveAs({name,bytes,dir:"downloads"});
   if(f){toast(L("Saved","تم الحفظ"));logAct(i.fid,"downloaded",name===i.n?"":name)}
   return;
  }catch(e){console.warn("in-app download failed, using browser",e)}
 }
 window.open(url,"_blank");
}

/* ---- backup everything to a folder on this PC ---- */
const mbs=n=>(n/1048576).toFixed(1)+" MB";
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function setupBackup(m,N){
 let dir=lsGet("bkDir",""),running=false,stop=false;
 const bd=m.q("#bd"),bl=m.q("#bl"),bm=m.q("#bm"),bp=m.q("#bp"),bg=m.q("#bg"),bx=m.q("#bx"),bc=m.q("#bc"),bo=m.q("#bo"),bz=m.q("#bz");
 bo.checked=lsGet("bkOld","0")==="1";bz.checked=lsGet("bkZip","0")==="1";
 bo.onchange=()=>lsSet("bkOld",bo.checked?"1":"0");bz.onchange=()=>lsSet("bkZip",bz.checked?"1":"0");
 const say=(s,k)=>{bm.textContent=s;bm.className="msg"+(k==="e"?" e":k==="k"?" k":"")};
 const refresh=async()=>{
  bd.textContent=dir||L("(not chosen)","(غير محدد)");
  bl.textContent="—";
  if(dir){try{const f=await N.backupInfo(dir);if(f)bl.textContent=`${f.time?new Date(f.time).toLocaleString():"—"} · ${f.count} ${L("files","ملف")} · ${mbs(f.size)}`}catch(e){}}
 };
 refresh();
 bc.onclick=async()=>{if(running)return;const d=await N.backupChoose();if(d){dir=d;lsSet("bkDir",d);say("");refresh()}};
 bx.onclick=()=>{stop=true;bx.disabled=true;say(L("Stopping after the current file…","جارٍ الإيقاف بعد الملف الحالي…"))};
 bg.onclick=async()=>{
  if(running)return;
  if(!dir){const d=await N.backupChoose();if(!d)return;dir=d;lsSet("bkDir",d);refresh()}
  running=true;stop=false;bg.disabled=bc.disabled=bo.disabled=bz.disabled=true;bx.style.display="";bx.disabled=false;
  try{
   const r=await runBackup({dir,old:bo.checked,zip:bz.checked,N,isStopped:()=>stop,
    onStatus:(txt,done,total)=>{say(txt);bp.innerHTML=total?`<progress max="${total}" value="${done}"></progress>`:`<div class="ibar"><i></i></div>`}});
   bp.innerHTML="";
   say(`${r.stopped?L("Stopped. ","تم الإيقاف. "):"✓ "}${L("Copied","تم نسخ")} ${r.copied} · ${L("already up to date","محدّث مسبقاً")} ${r.same+r.moved} · ${L("failed","فشل")} ${r.failed}\n${L("Downloaded","تم تنزيل")} ${mbs(r.bytes)}${r.zipPath?` · ZIP ${mbs(r.zipSize)}`:""}`,r.failed?"e":"k");
   refresh();
  }catch(e){bp.innerHTML="";say(errText(e),"e")}
  running=false;bg.disabled=bc.disabled=bo.disabled=bz.disabled=false;bx.style.display="none";
 };
}
async function runBackup({dir,old,zip,N,isStopped,onStatus}){
 onStatus(L("Reading the file list…","جارٍ قراءة قائمة الملفات…"));
 const files=D.filter(x=>x.t!=="folder"&&x.sp),folders=D.filter(x=>x.t==="folder");
 const clean=s=>String(s).replace(/[<>:"/\\|?*\u0000-\u001f]/g,"_");
 const dirRel=id=>pathOf(id).split(" / ").filter(Boolean).map(clean).join("/");
 const used=new Set(),items=[];
 for(const f of files){
  const d=dirRel(f.p),nm=clean(f.n);
  let rel=(d?d+"/":"")+nm;
  if(used.has(rel.toLowerCase())){const ext=nm.includes(".")?nm.slice(nm.lastIndexOf(".")):"";rel=(d?d+"/":"")+nm.slice(0,nm.length-ext.length)+` (${f.fid.slice(0,6)})`+ext}
  used.add(rel.toLowerCase());
  items.push({key:f.fid+"|"+f.sp,fid:f.fid,sp:f.sp,rel});
 }
 const meta={exportedAt:new Date().toISOString(),by:S.u,files:[],folders:folders.map(f=>({id:f.fid,name:f.n,path:dirRel(f.id)}))};
 let raw=[];
 try{raw=(await getDocs(collection(db,"files"))).docs}catch(e){}
 const ser=(k,v)=>v&&typeof v.toMillis==="function"?new Date(v.toMillis()).toISOString():v;
 const verMap=new Map();
 if(old){
  let n=0;
  for(const f of files){
   if(isStopped())break;
   onStatus(L("Reading version lists…","جارٍ قراءة قوائم الإصدارات…")+` ${++n}/${files.length}`,n,files.length);
   try{
    const vs=(await getDocs(collection(db,"files",f.fid,"versions"))).docs;
    verMap.set(f.fid,vs.map(v=>({id:v.id,...v.data()})));
    const nm=clean(f.n),ext=nm.includes(".")?nm.slice(nm.lastIndexOf(".")):"",bn=nm.slice(0,nm.length-ext.length),d=dirRel(f.p);
    for(const v of vs){const x=v.data();if(!x.storagePath||x.storagePath===f.sp)continue;
     items.push({key:f.fid+"|"+x.storagePath,fid:f.fid,sp:x.storagePath,rel:`_older versions/${d?d+"/":""}${bn} (v${v.id})${ext}`})}
   }catch(e){}
  }
 }
 meta.files=raw.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data(),ser)),versions:(verMap.get(d.id)||[]).map(v=>JSON.parse(JSON.stringify(v,ser)))}));
 onStatus(L("Checking what is already backed up…","جارٍ فحص ما تم نسخه مسبقاً…"));
 const plan=await N.backupPlan({dir,items:items.map(({key,fid,rel})=>({key,fid,rel})),dirs:folders.map(f=>dirRel(f.id))});
 const todo=items.filter(x=>plan.todo.includes(x.key));
 let done=0,copied=0,failed=0,bytes=0,idx=0;
 const worker=async()=>{
  while(!isStopped()){
   const it=todo[idx++];if(!it)return;
   onStatus(`${L("Copying","جارٍ النسخ")} ${done+1}/${todo.length} · ${it.rel.split("/").pop()}`,done,todo.length);
   try{
    const url=await getDownloadURL(sref(storage,it.sp));
    const r=await N.backupSave({key:it.key,fid:it.fid,rel:it.rel,url});
    copied++;bytes+=r.size;
   }catch(e){failed++;console.warn("backup failed",it.rel,e)}
   done++;
  }
 };
 await Promise.all([worker(),worker(),worker()]);
 const stopped=isStopped();
 onStatus(zip&&!stopped?L("Compressing…","جارٍ الضغط…"):L("Finishing…","جارٍ الإنهاء…"));
 const fin=await N.backupFinish({dir,meta,zip:zip&&!stopped});
 return{copied,same:plan.same,moved:plan.moved,failed,bytes,stopped,zipPath:fin.zipPath,zipSize:fin.zipSize};
}
