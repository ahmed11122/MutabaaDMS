<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutabaa DMS</title>
<style>
:root{--bg:#eef2f7;--sf:#fff;--tx:#14202e;--mu:#667487;--bd:#dde4ec;--pr:#0b5cad;--pt:#fff;--hv:#e9f0f9;--sl:#d9e8f9;--ok:#1f7a3a;--wn:#a35f00;--bd2:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--sf:#18222f;--tx:#e6edf5;--mu:#93a1b3;--bd:#2a3748;--pr:#5aa5ee;--pt:#07121f;--hv:#1f2c3b;--sl:#23405f;--ok:#6cc58a;--wn:#e0a24a;--bd2:#f08a83}}
:root[data-theme="dark"]{--bg:#0f1620;--sf:#18222f;--tx:#e6edf5;--mu:#93a1b3;--bd:#2a3748;--pr:#5aa5ee;--pt:#07121f;--hv:#1f2c3b;--sl:#23405f;--ok:#6cc58a;--wn:#e0a24a;--bd2:#f08a83}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",Tahoma,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column}
.login{height:100%;display:grid;place-items:center;padding:16px}
.lc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:28px;width:100%;max-width:340px;display:grid;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--pr)}
.logo i{width:30px;height:30px;border-radius:50%;border:6px solid var(--pr);box-sizing:border-box;display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--pr)}
.lc label{display:grid;gap:4px;color:var(--mu);font-size:13px}
.lc input,.lc select{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.btn.s{background:transparent;color:var(--pr);border:1px solid var(--bd)}
.btn.s:hover{background:var(--hv)}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--pr);color:var(--pt)}
.top .logo{color:var(--pt);font-size:17px}.top .logo i{border-color:var(--pt)}.top .logo i:after{background:var(--pt)}
.top input{flex:1;max-width:440px;margin-inline:auto;padding:8px 14px;border-radius:999px;border:0;background:rgba(255,255,255,.2);color:var(--pt)}
.top input::placeholder{color:var(--pt);opacity:.75}
.top button{background:rgba(255,255,255,.18);color:var(--pt);border:0;border-radius:999px;padding:6px 12px}
.body{flex:1;min-height:0;display:flex}
.side{width:210px;padding:12px 8px;display:flex;flex-direction:column;gap:2px;border-inline-end:1px solid var(--bd);background:var(--sf)}
.side button{text-align:start;background:none;border:0;padding:9px 12px;border-radius:999px;display:flex;justify-content:space-between}
.side button:hover{background:var(--hv)}
.side button.on{background:var(--sl);font-weight:600}
.side em{font-style:normal;color:var(--mu);font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--sf)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;position:relative}
.crumbs{flex:1;font-size:17px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs a{color:var(--tx);cursor:pointer}.crumbs a:hover{color:var(--pr)}.crumbs span{color:var(--mu);font-weight:400}
.menu{position:absolute;inset-inline-start:16px;top:46px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px;z-index:5;display:none;min-width:190px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.menu.o{display:block}
.menu button{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--hv)}
.list{flex:1;overflow:auto}
.row{display:grid;grid-template-columns:1fr 90px 120px;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--bd);cursor:pointer}
.row.h{position:sticky;top:0;background:var(--sf);color:var(--mu);font-size:13px;cursor:default;border-top:0;border-bottom:1px solid var(--bd)}
.row:not(.h):hover{background:var(--hv)}
.row.sel{background:var(--sl)}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{flex:none;width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.ic.docx{background:#2b6cb8}.ic.xlsx{background:#1f8a4c}.ic.pdf{background:#c9372c}.ic.folder{background:none;font-size:24px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.lk{color:var(--wn)}.tag.approved{color:var(--ok)}.tag.rejected{color:var(--bd2)}.tag.submitted{color:var(--pr)}.tag.draft{color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.empty{padding:48px 16px;text-align:center;color:var(--mu)}
.panel{width:310px;border-inline-start:1px solid var(--bd);background:var(--sf);padding:16px;overflow:auto;display:none}
.panel.o{display:block}
.panel h3{margin:8px 0 2px;word-break:break-word}
.tabs{display:flex;gap:4px;margin:14px 0 10px;border-bottom:1px solid var(--bd)}
.tabs button{background:none;border:0;padding:8px 10px;border-bottom:2px solid transparent;color:var(--mu)}
.tabs button.on{color:var(--pr);border-color:var(--pr);font-weight:600}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px;font-size:14px}.kv span:nth-child(odd){color:var(--mu)}
.act{display:grid;gap:8px;margin-top:14px}
.li{padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.o{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
@media(max-width:760px){
.body{flex-direction:column}
.side{width:auto;flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--bd);padding:6px}
.side button{white-space:nowrap;gap:6px}
.row{grid-template-columns:1fr 66px 84px;padding:8px 12px}
.panel{position:fixed;inset-inline:0;bottom:0;width:auto;max-height:70%;border-top:1px solid var(--bd);box-shadow:0 -6px 24px rgba(0,0,0,.2);z-index:6}
.top input{min-width:0}
}

.auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.auth-brand{background:linear-gradient(145deg,var(--pr),#083d73);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth-brand .logo{color:#fff;font-size:22px}.auth-brand .logo i{border-color:#fff}.auth-brand .logo i:after{background:#fff}
.auth-brand h2{font-size:32px;line-height:1.25;margin:0 0 12px;font-weight:700}
.auth-brand p{margin:0;opacity:.85;max-width:420px;line-height:1.6}
.auth-brand small{opacity:.7}
.auth-side{display:flex;align-items:center;justify-content:center;padding:32px 20px;position:relative}
.auth-lang{position:absolute;top:16px;inset-inline-end:20px;background:none;border:0;color:var(--mu);font-size:14px;padding:6px 10px;border-radius:8px}
.auth-lang:hover{background:var(--hv);color:var(--tx)}
.auth-form{width:100%;max-width:380px;display:grid;gap:16px}
.auth-form .logo.m{display:none}
.auth-form h1{margin:0;font-size:26px}
.auth-form .sub{margin:0;color:var(--mu)}
.fld{display:grid;gap:6px;font-size:14px;font-weight:600}
.fld .in{position:relative;display:flex}
.fld input[type=email],.fld input[type=password],.fld input[type=text]{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.fld input:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 25%,transparent)}
.fld .eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);padding:8px;font-size:13px;border-radius:8px}
.fld .eye:hover{color:var(--tx)}
.fld .in input[type=password],.fld .in input.pwv{padding-inline-end:64px}
.arow{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.arow label{display:flex;align-items:center;gap:8px;color:var(--mu);cursor:pointer}
.arow a,.lnk{color:var(--pr);cursor:pointer;background:none;border:0;padding:0;font-size:14px}
.arow a:hover,.lnk:hover{text-decoration:underline}
.btn.big{width:100%;border-radius:10px;padding:13px;font-size:16px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:14px;padding:10px 12px;border-radius:8px;display:none}
.msg.e{display:block;color:var(--bd2);background:color-mix(in srgb,var(--bd2) 12%,transparent)}
.msg.k{display:block;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.auth-foot{text-align:center;color:var(--mu);font-size:13px;margin-top:8px}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-brand{display:none}.auth-form .logo.m{display:flex}.auth-side{align-items:flex-start;padding-top:72px}}
.kb{margin-inline-start:auto;background:none;border:0;color:var(--mu);font-size:20px;line-height:1;padding:2px 8px;border-radius:6px;cursor:pointer}
.kb:hover{background:var(--sl);color:var(--tx)}
.pm{position:fixed;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px;z-index:20;min-width:180px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.pm button{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--tx);cursor:pointer}
.pm button:hover{background:var(--hv)}.pm button.dg{color:var(--bd2)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.mb{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:20px;width:100%;max-width:420px;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mb h3{margin:0}.mb p{margin:0;color:var(--mu);font-size:14px}
.mb input[type=text],.mb select{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.mb .nmb{background:var(--bg);border:1px dashed var(--bd2);border-radius:8px;padding:8px 10px;font-weight:600;word-break:break-all;-webkit-user-select:none;user-select:none}
.mb .er2{display:flex;gap:8px;align-items:center}.mb .er2 .ext{color:var(--mu);white-space:nowrap}
.mbt{display:flex;gap:8px;justify-content:flex-end}
.btn.dg{background:var(--bd2);color:#fff}.btn.s.dg{background:transparent;color:var(--bd2);border:1px solid var(--bd2)}
.uw{padding:16px;display:grid;gap:16px}
.uf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px}
.uf h3{grid-column:1/-1;margin:0}.uf label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.uf input,.uf select,.ur select{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font-size:14px;min-width:0}
.uf .msg{grid-column:1/-1}
.ur{display:grid;grid-template-columns:1.2fr 1.5fr 120px auto;gap:8px;align-items:center;padding:10px 4px;border-top:1px solid var(--bd)}
.ur .off{opacity:.55}.ur .acts{display:flex;gap:6px;flex-wrap:wrap}
.ur button{background:none;border:1px solid var(--bd);color:var(--pr);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}
@media(max-width:760px){.ur{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="app"></div><div class="toast" id="toast"></div>
<script>
const T={en:{si:"Sign in",em:"Email",pw:"Password",ro:"Role",all:"All files",rec:"Recent",lk:"Locked",rv:"Needs review",nw:"New",nm:"Name",sz:"Size",md:"Modified",se:"Search files…",de:"Details",ve:"Versions",ac:"Activity",lb:"Locked by",out:"Sign out",wd:"Word document",xl:"Excel spreadsheet",up:"Upload file",fo:"New folder",em0:"No files here. Use New to create or upload one.",op:"Open and edit",rl:"Release lock",dl:"Download",ap:"Approve",bk:"Send back to employee",employee:"Employee",manager:"Manager",admin:"Admin",draft:"Draft",submitted:"Submitted",approved:"Approved",rejected:"Needs changes",st:"Status",ty:"Type",fr:"Free",cur:"Current version",demo:"Demo data. Connect Firebase to make it live.",ar:"العربية"},
ar:{si:"تسجيل الدخول",em:"البريد الإلكتروني",pw:"كلمة المرور",ro:"الدور",all:"كل الملفات",rec:"الأخيرة",lk:"مقفلة",rv:"بانتظار المراجعة",nw:"جديد",nm:"الاسم",sz:"الحجم",md:"آخر تعديل",se:"ابحث في الملفات…",de:"التفاصيل",ve:"الإصدارات",ac:"النشاط",lb:"مقفل بواسطة",out:"تسجيل الخروج",wd:"مستند Word",xl:"جدول Excel",up:"رفع ملف",fo:"مجلد جديد",em0:"لا توجد ملفات هنا. استخدم جديد للإنشاء أو الرفع.",op:"فتح وتحرير",rl:"إلغاء القفل",dl:"تنزيل",ap:"اعتماد",bk:"إعادة للموظف",employee:"موظف",manager:"مدير",admin:"مسؤول",draft:"مسودة",submitted:"مرسل",approved:"معتمد",rejected:"يحتاج تعديل",st:"الحالة",ty:"النوع",fr:"غير مقفل",cur:"الإصدار الحالي",demo:"بيانات تجريبية. اربط Firebase لتصبح فعلية.",ar:"English"}};
let S={u:null,role:"employee",stack:[null],sel:null,view:"all",q:"",lang:"en",tab:0,n:100};
const K=1024,M=K*K;
let D=[
{id:1,p:null,n:"Contracts",t:"folder"},{id:2,p:null,n:"HR",t:"folder"},{id:3,p:null,n:"Finance",t:"folder"},{id:4,p:null,n:"Monthly reports",t:"folder"},
{id:10,p:null,n:"Office policy.pdf",t:"pdf",s:820*K,m:3*1440,l:null,st:"approved"},
{id:11,p:null,n:"Meeting notes.docx",t:"docx",s:46*K,m:25,l:"Sara",st:"draft"},
{id:12,p:null,n:"Team schedule.xlsx",t:"xlsx",s:131*K,m:190,l:null,st:"submitted"},
{id:20,p:1,n:"Supplier contract.docx",t:"docx",s:98*K,m:2*1440,l:null,st:"submitted"},
{id:21,p:1,n:"Lease agreement.pdf",t:"pdf",s:2.4*M,m:9*1440,l:null,st:"approved"},
{id:30,p:2,n:"Leave requests.xlsx",t:"xlsx",s:74*K,m:60,l:"Omar",st:"draft"},
{id:31,p:2,n:"Job description.docx",t:"docx",s:38*K,m:5*1440,l:null,st:"rejected"},
{id:40,p:3,n:"Invoices October.xlsx",t:"xlsx",s:312*K,m:340,l:null,st:"submitted"},
{id:41,p:3,n:"Budget 2027.xlsx",t:"xlsx",s:1.2*M,m:1440,l:"Sara",st:"draft"},
{id:50,p:4,n:"September report.docx",t:"docx",s:210*K,m:20*1440,l:null,st:"approved"},
{id:51,p:4,n:"October report.docx",t:"docx",s:188*K,m:12,l:null,st:"draft"}];
const $=s=>document.querySelector(s),t=k=>T[S.lang][k]||k;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fs=b=>b==null?"—":b<K?b+" B":b<M?Math.round(b/K)+" KB":(b/M).toFixed(1)+" MB";
const ago=m=>{const r=new Intl.RelativeTimeFormat(S.lang,{numeric:"auto"});return m<60?r.format(-Math.max(1,Math.round(m)),"minute"):m<1440?r.format(-Math.round(m/60),"hour"):r.format(-Math.round(m/1440),"day")};
const ico=i=>`<span class="ic ${i.t}">${{docx:"W",xlsx:"X",pdf:"P",folder:"📁"}[i.t]}</span>`;
const mgr=()=>S.role!=="employee";
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("o");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("o"),2600)}
function login(){
 document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.documentElement.lang=S.lang;
 $("#app").innerHTML=`<div class="login"><div class="lc"><div class="logo"><i></i>Mutabaa DMS</div>
 <label>${t("em")}<input id="em" type="email" value="sara@company.com"></label>
 <label>${t("pw")}<input id="pw" type="password" value="demo1234"></label>
 <label>${t("ro")}<select id="ro"><option value="employee">${t("employee")}</option><option value="manager">${t("manager")}</option><option value="admin">${t("admin")}</option></select></label>
 <button class="btn" id="go">${t("si")}</button><button class="btn s" id="lg">${t("ar")}</button><span class="mu">${t("demo")}</span></div></div>`;
 $("#ro").value=S.role;
 $("#lg").onclick=()=>{S.lang=S.lang==="en"?"ar":"en";S.role=$("#ro").value;login()};
 $("#go").onclick=()=>{S.role=$("#ro").value;const n=$("#em").value.split("@")[0]||"User";S.u=n[0].toUpperCase()+n.slice(1);S.stack=[null];S.sel=null;S.view="all";shell()}
}
function shell(){
 document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.documentElement.lang=S.lang;
 $("#app").innerHTML=`<div class="top"><div class="logo"><i></i>Mutabaa DMS</div><input id="q" type="search" placeholder="${t("se")}" value="${esc(S.q)}"><button id="lg">${t("ar")}</button><button id="so">${esc(S.u)} · ${t("out")}</button></div>
 <div class="body"><nav class="side" id="nav"></nav><section class="main"><div class="bar"><button class="btn" id="nb">+ ${t("nw")}</button><div class="crumbs" id="cr"></div>
 <div class="menu" id="mn"><button data-a="docx">${t("wd")}</button><button data-a="xlsx">${t("xl")}</button><button data-a="folder">${t("fo")}</button><button data-a="up">${t("up")}</button></div></div>
 <div class="list" id="ls"></div></section><aside class="panel" id="pn"></aside></div><input type="file" id="fi" hidden multiple>`;
 $("#q").oninput=e=>{S.q=e.target.value;list()};
 $("#lg").onclick=()=>{S.lang=S.lang==="en"?"ar":"en";shell()};
 $("#so").onclick=()=>{S.u=null;login()};
 $("#nb").onclick=e=>{e.stopPropagation();$("#mn").classList.toggle("o")};
 document.onclick=()=>{const m=$("#mn");m&&m.classList.remove("o")};
 $("#mn").onclick=e=>{const a=e.target.dataset.a;if(!a)return;if(a==="up")$("#fi").click();else add(a)};
 $("#fi").onchange=e=>{[...e.target.files].forEach(f=>{const x=f.name.split(".").pop().toLowerCase();D.push({id:S.n++,p:cur(),n:f.name,t:["docx","xlsx","pdf"].includes(x)?x:"pdf",s:f.size,m:0,l:null,st:"draft"})});list();nav()};
 nav();list();pane();
}
const cur=()=>S.stack[S.stack.length-1];
function add(a){
 const sib=D.filter(i=>i.p===cur()&&i.t===a).length+1;
 const n=a==="folder"?`${t("fo")} ${sib}`:`${a==="docx"?"Document":"Spreadsheet"} ${sib}.${a}`;
 D.push(a==="folder"?{id:S.n++,p:cur(),n,t:a}:{id:S.n++,p:cur(),n,t:a,s:a==="docx"?12*K:8*K,m:0,l:null,st:"draft"});list();nav();toast(n)
}
function files(){
 if(S.q)return D.filter(i=>i.n.toLowerCase().includes(S.q.toLowerCase()));
 if(S.view==="rec")return D.filter(i=>i.t!=="folder").sort((a,b)=>a.m-b.m).slice(0,8);
 if(S.view==="lk")return D.filter(i=>i.l);
 if(S.view==="rv")return D.filter(i=>i.st==="submitted");
 return D.filter(i=>i.p===cur())
}
function nav(){
 const c=v=>v==="lk"?D.filter(i=>i.l).length:D.filter(i=>i.st==="submitted").length;
 const it=[["all",t("all")],["rec",t("rec")],["lk",t("lk"),c("lk")]];if(mgr())it.push(["rv",t("rv"),c("rv")]);if(mgr())it.push(["us",S.lang==="ar"?"المستخدمون":"Users"]);
 $("#nav").innerHTML=it.map(([v,l,n])=>`<button data-v="${v}" class="${S.view===v?"on":""}">${l}${n!=null?`<em>${n}</em>`:""}</button>`).join("");
 $("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;S.q="";const q=$("#q");if(q)q.value="";if(S.view==="all")S.stack=[null];list();nav()}
}
function list(){

function pane(){
 const p=$("#pn"),i=D.find(x=>x.id===S.sel);if(!i){p.classList.remove("o");return}
 p.classList.add("o");const mine=i.l===S.u;
 const tabs=["de","ve","ac"].map((k,n)=>`<button class="${S.tab===n?"on":""}" data-t="${n}">${t(k)}</button>`).join("");

 if(S.tab===0)body=`<div class="kv"><span>${t("ty")}</span><span>${i.t.toUpperCase()}</span><span>${t("sz")}</span><span>${fs(i.s)}</span><span>${t("md")}</span><span>${ago(i.m)}</span><span>${t("st")}</span><span><span class="tag ${i.st}">${t(i.st)}</span></span><span>${t("lb")}</span><span>${i.l?esc(i.l):t("fr")}</span></div>
 <div class="act"><button class="btn" data-a="op">${t("op")}</button>${mine?`<button class="btn s" data-a="rl">${t("rl")}</button>`:""}<button class="btn s" data-a="dl">${t("dl")}</button>
 ${mgr()&&i.st==="submitted"?`<button class="btn" data-a="ap">${t("ap")}</button><button class="btn s" data-a="bk">${t("bk")}</button>`:""}</div>`;
 else if(S.tab===1)body=[3,2,1].map((v,k)=>`<div class="li"><b>v${v}</b>${k?"":` <span class="tag approved">${t("cur")}</span>`}<div class="mu">${["Sara","Omar","Sara"][k]} · ${ago(i.m+k*400+5)} · ${fs(i.s?i.s-k*3*K:0)}</div></div>`).join("");
 else body=[["Sara","opened"],["Sara","saved v3"],["Omar","saved v2"]].map(([u,a],k)=>`<div class="li">${u} · ${a}<div class="mu">${ago(i.m+k*90+2)}</div></div>`).join("");
 p.innerHTML=`<div class="ic ${i.t}">${{docx:"W",xlsx:"X",pdf:"P",folder:""}[i.t]}</div><h3>${esc(i.n)}</h3><div class="tabs">${tabs}</div>${body}`;
 p.onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t){S.tab=+b.dataset.t;pane();return}
  const a=b.dataset.a;
  if(a==="op"){if(i.l&&!mine)toast(`${t("lb")} ${i.l}`);else{i.l=S.u;toast("myapp://edit/"+i.id);list();pane();nav()}}
  if(a==="rl"){i.l=null;list();pane();nav()}
  if(a==="dl")toast(i.n);
  if(a==="ap"){i.st="approved";list();pane();nav()}
  if(a==="bk"){i.st="rejected";list();pane();nav()}}
}

    <label class="fld">${t("pw")}<span class="in"><input id="pw" name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" id="ey">${X.sh}</button></span></label>

 const er=$("#er"),show=(m,k)=>{er.textContent=m;er.className="msg "+(k?"k":"e")};
 if(LE){show(LE);LE=""}
 $("#lg").onclick=()=>{LM=$("#em").value;S.lang=ar()?"en":"ar";login()};
 $("#ey").onclick=()=>{const p=$("#pw"),v=p.type==="password";p.type=v?"text":"password";p.classList.toggle("pwv",v);$("#ey").textContent=v?X.hd:X.sh;p.focus()};
 $("#fp").onclick=async()=>{const m=$("#em").value.trim();if(!m){show(X.entem);$("#em").focus();return}
  try{await sendPasswordResetEmail(auth,m)}catch(e){}
  show(X.sent,1)};
 $("#lf").onsubmit=async e=>{e.preventDefault();
  const m=$("#em").value.trim(),p=$("#pw").value;
  if(!m||!p){show(X.ent);return}
  const b=$("#go");b.disabled=true;b.textContent=X.sg;show("");er.className="msg";
  try{
   await setPersistence(auth,$("#rm").checked?browserLocalPersistence:browserSessionPersistence);
   await signInWithEmailAndPassword(auth,m,p);
  }catch(err){
   b.disabled=false;b.textContent=t("si");
   const c=err.code||"";
   show(c==="auth/too-many-requests"?(ar()?"محاولات كثيرة. حاول لاحقاً أو أعد تعيين كلمة المرور":"Too many attempts. Try later or reset your password")
    :c==="auth/network-request-failed"?(ar()?"تحقق من اتصال الإنترنت":"Check your internet connection")
    :c==="auth/user-disabled"?(ar()?"هذا الحساب معطّل":"This account is disabled")
    :(ar()?"البريد أو كلمة المرور غير صحيحة":"Wrong email or password"));

 setTimeout(()=>{const f=$("#em").value?$("#pw"):$("#em");f&&f.focus()},50);

onAuthStateChanged(auth,async u=>{
 unsub&&unsub();unsub=null;
 if(!u){S.u=null;D=[];login();return}

});

window.add=async a=>{
 if(!mgr())return;
 if(a!=="folder"){toast(ar()?"قوالب Word وExcel تأتي لاحقاً. ارفع ملفاً الآن.":"Word and Excel templates come next. Upload a file for now.");return}
 const k=D.filter(i=>i.p===cur()&&i.t==="folder").length+1;
 try{await addDoc(collection(db,"files"),{name:`${t("fo")} ${k}`,folderId:fidOf(cur()),type:"folder",ownerId:uid(),createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}catch(e){fail(e)}

async function upload(e){
 if(!mgr()){e.target.value="";return}
 const list_=[...e.target.files];e.target.value="";
 for(const f of list_){
  const x=f.name.split(".").pop().toLowerCase();
  if(!["docx","xlsx","pdf"].includes(x)){toast(ar()?"الأنواع المسموحة: Word وExcel وPDF":"Only Word, Excel and PDF files");continue}
  try{
   const r=await addDoc(collection(db,"files"),{name:f.name,folderId:fidOf(cur()),type:x,size:f.size,status:"draft",currentVersion:1,ownerId:uid(),ownerName:S.u,lockedBy:null,lockedByName:null,lockExpiresAt:null,storagePath:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
   const path=`files/${r.id}/v1`;
   await uploadBytes(sref(storage,path),f);
   await updateDoc(r,{storagePath:path});
   await setDoc(doc(db,"files",r.id,"versions","1"),{storagePath:path,size:f.size,createdBy:uid(),createdAt:serverTimestamp()});
   toast(f.name)
  }catch(err){fail(err)}
 }
}

const lock=r=>runTransaction(db,async tx=>{
 const x=(await tx.get(r)).data(),now=Date.now(),ex=x.lockExpiresAt?.toMillis?.()??0;
 if(x.lockedBy&&x.lockedBy!==uid()&&ex>now)throw new Error(`${t("lb")} ${x.lockedByName}`);
 tx.update(r,{lockedBy:uid(),lockedByName:S.u,lockExpiresAt:Timestamp.fromMillis(now+600000),updatedAt:serverTimestamp()})
});
const upd=(r,o)=>updateDoc(r,{...o,updatedAt:serverTimestamp()});

/* ---- Desktop app bridge: open in Word/Excel, save = new version ---- */
const NS=new Map();
async function pushVersion(s,bytes){
 const id=s.r.id;
 const snap=await getDocs(collection(db,"files",id,"versions"));
 const next=Math.max(0,s.cv||0,s.tried||0,...snap.docs.map(d=>parseInt(d.id,10)||0))+1;
 s.tried=next;
 const p=`files/${id}/${next}`;
 await uploadBytes(sref(storage,p),bytes);
 await setDoc(doc(db,"files",id,"versions",String(next)),{storagePath:p,size:bytes.length,createdBy:uid(),createdAt:serverTimestamp()});
 await upd(s.r,{storagePath:p,currentVersion:next,size:bytes.length});
}
async function nativeEdit(i,r){
 if(NS.has(i.fid)){await window.dmsNative.open({id:i.fid,name:i.n,bytes:new Uint8Array(0)});return}
 const url=await getDownloadURL(sref(storage,i.sp));
 const cv=(await getDoc(r)).data()?.currentVersion||0;
 await window.dmsNative.open({id:i.fid,name:i.n,url});
 NS.set(i.fid,{r,cv,q:Promise.resolve(),hb:setInterval(()=>updateDoc(r,{lockExpiresAt:Timestamp.fromMillis(Date.now()+600000)}).catch(()=>{}),120000)});
 toast(ar()?"تم فتح الملف. احفظ كالمعتاد وسيتم رفع نسخة جديدة":"Opened. Save as usual - each save becomes a new version")
}
if(window.dmsNative){
 window.dmsNative.onChanged(({id,bytes})=>{const s=NS.get(id);if(!s)return;
  s.q=s.q.then(async()=>{for(let k=0;k<4;k++){try{await pushVersion(s,new Uint8Array(bytes));toast(ar()?"تم حفظ نسخة جديدة":"New version saved");return}catch(e){await new Promise(z=>setTimeout(z,5000))}}toast(ar()?"فشل رفع النسخة - تحقق من الإنترنت":"Upload failed - check your internet")})});
 window.dmsNative.onClosed(({id})=>{const s=NS.get(id);if(!s)return;clearInterval(s.hb);
  s.q=s.q.then(()=>upd(s.r,{lockedBy:null,lockedByName:null,lockExpiresAt:null})).catch(()=>{}).then(()=>{NS.delete(id);toast(ar()?"تم إغلاق الملف وفك القفل":"File closed, lock released")})});
}

 const nb=$("#nb");
 if(S.q&&S.view==="us"){S.view="all";nav()}
 if(nb)nb.style.display=(!mgr()||(S.view==="us"&&mgr()))?"none":"";
 if(S.view==="us"&&mgr()){if(!$("#uf"))renderUsers();return}
 list0.apply(this,arguments);
 if(mgr())document.querySelectorAll("#ls .row:not(.h) .nm").forEach(n=>{const id=n.closest(".row").dataset.id;n.insertAdjacentHTML("beforeend",`<button class="kb" data-k="${id}" aria-label="More">\u22EF</button>`)})

 pane0();

 if(act&&mgr())act.insertAdjacentHTML("beforeend",`<button class="btn s" data-a="rn">${L("Rename","إعادة تسمية")}</button><button class="btn s" data-a="mv">${L("Move to folder","نقل إلى مجلد")}</button>${mgr()?`<button class="btn s dg" data-a="rm">${L("Delete","حذف")}</button>`:""}`);
 if(act&&["draft","rejected"].includes(i.st)&&(!i.l||i.l===S.u))act.insertAdjacentHTML("beforeend",`<button class="btn s" data-a="sb">${ar()?"إرسال للمراجعة":"Submit for review"}</button>`);
 p.onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){S.tab=+b.dataset.t;pane();return}
  const a=b.dataset.a,r=doc(db,"files",i.fid);
  if(ACT[a]){ACT[a](i);return}
  try{
   if(a==="op"||a==="dl"){

    window.open(await getDownloadURL(sref(storage,i.sp)),"_blank")
   }
   if(a==="rl")await upd(r,{lockedBy:null,lockedByName:null,lockExpiresAt:null});
   if(a==="sb")await upd(r,{status:"submitted"});
   if(a==="ap"||a==="bk"){
    const d=a==="ap"?"approved":"rejected";

  }catch(err){fail(err)}
 }
};

/* ---- Rename / Move to folder / Delete (type the name to confirm) ---- */
const L=(en,a)=>ar()?a:en;
const BAD=/[\\/:*?"<>|]/;
function modal(html){
 const o=document.createElement("div");o.className="mo";o.innerHTML=`<div class="mb" role="dialog" aria-modal="true">${html}</div>`;
 document.body.appendChild(o);
 const kd=e=>{if(e.key==="Escape")close()};
 const close=()=>{o.remove();document.removeEventListener("keydown",kd)};
 document.addEventListener("keydown",kd);
 o.addEventListener("mousedown",e=>{if(e.target===o)close()});
 return{o,close,q:s=>o.querySelector(s)};
}
const dRef=i=>doc(db,"files",i.fid);
const kids=id=>{const s=new Set();const w=x=>D.filter(c=>c.p===x).forEach(c=>{s.add(c.id);w(c.id)});w(id);return s};
const pathOf=id=>{const a=[];let c=D.find(x=>x.id===id);while(c){a.unshift(c.n);c=D.find(x=>x.id===c.p)}return a.join(" / ")};
function blocked(i){
 if(i.l&&i.l!==S.u){toast(`${t("lb")} ${i.l}`);return true}
 return false;
}
function doRename(i){
 if(blocked(i))return;
 const isF=i.t==="folder",dot=isF?-1:i.n.lastIndexOf("."),ext=dot>0?i.n.slice(dot):"",base=ext?i.n.slice(0,dot):i.n;
 const m=modal(`<h3>${L("Rename","إعادة تسمية")}</h3><div class="er2"><input id="mi" type="text" dir="auto" maxlength="120" autocomplete="off" value="${esc(base)}">${ext?`<span class="ext">${esc(ext)}</span>`:""}</div><div class="msg" id="me"></div><div class="mbt"><button class="btn s" id="mc">${L("Cancel","إلغاء")}</button><button class="btn" id="mk">${L("Save","حفظ")}</button></div>`);
 const inp=m.q("#mi"),me=m.q("#me");inp.focus();inp.select();
 const err=s=>{me.textContent=s;me.className="msg e"};
 const go=async()=>{
  const v=inp.value.trim();
  if(!v)return err(L("Name cannot be empty","الاسم مطلوب"));
  if(BAD.test(v))return err(L('Name cannot contain \\ / : * ? " < > |','الاسم لا يمكن أن يحتوي على \\ / : * ? " < > |'));
  const nn=v+ext;
  if(nn===i.n){m.close();return}
  if(D.some(x=>x.p===i.p&&x.id!==i.id&&x.n.toLowerCase()===nn.toLowerCase()))return err(L("This name already exists here","هذا الاسم موجود مسبقاً هنا"));
  m.q("#mk").disabled=true;
  try{await upd(dRef(i),{name:nn});m.close();toast(L("Renamed","تمت إعادة التسمية"))}
  catch(e){m.q("#mk").disabled=false;err(e.code==="permission-denied"?L("Not allowed","غير مسموح"):e.message)}
 };
 m.q("#mk").onclick=go;m.q("#mc").onclick=m.close;
 inp.onkeydown=e=>{if(e.key==="Enter")go()};
}
function doMove(i){
 if(blocked(i))return;
 const ex=i.t==="folder"?new Set([i.id,...kids(i.id)]):new Set();
 const opts=[];
 if(i.p!==null)opts.push(["",t("all")]);
 D.filter(x=>x.t==="folder"&&!ex.has(x.id)&&x.id!==i.p).forEach(x=>opts.push([x.id,pathOf(x.id)]));
 const rest=opts.slice(i.p!==null?1:0).sort((a,b)=>a[1].localeCompare(b[1]));
 const all=(i.p!==null?[opts[0]]:[]).concat(rest);
 if(!all.length){toast(L("No other folder to move to","لا يوجد مجلد آخر للنقل إليه"));return}
 const m=modal(`<h3>${L("Move to folder","نقل إلى مجلد")}</h3><p>${esc(i.n)}</p><select id="ms">${all.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select><div class="msg" id="me"></div><div class="mbt"><button class="btn s" id="mc">${L("Cancel","إلغاء")}</button><button class="btn" id="mk">${L("Move","نقل")}</button></div>`);
 const me=m.q("#me");
 m.q("#mc").onclick=m.close;
 m.q("#mk").onclick=async()=>{
  const v=m.q("#ms").value,tid=v===""?null:+v;
  if(D.some(x=>x.p===tid&&x.id!==i.id&&x.n.toLowerCase()===i.n.toLowerCase())){me.textContent=L("A file with this name already exists in that folder","يوجد عنصر بنفس الاسم في ذلك المجلد");me.className="msg e";return}
  m.q("#mk").disabled=true;
  try{await upd(dRef(i),{folderId:tid===null?null:fidOf(tid)});m.close();S.sel=null;toast(L("Moved","تم النقل"))}
  catch(e){m.q("#mk").disabled=false;me.textContent=e.code==="permission-denied"?L("Not allowed","غير مسموح"):e.message;me.className="msg e"}
 };
}
function doDelete(i){
 if(!mgr()){toast(L("Only managers can delete","الحذف للمدراء فقط"));return}
 if(blocked(i))return;
 if(NS.has(i.fid)){toast(L("Close the file in Word/Excel first","أغلق الملف في Word/Excel أولاً"));return}
 const isF=i.t==="folder";
 if(isF&&D.some(x=>x.p===i.id)){toast(L("Folder is not empty. Move or delete its files first.","المجلد غير فارغ. انقل ملفاته أو احذفها أولاً"));return}
 const m=modal(`<h3>${isF?L("Delete folder","حذف المجلد"):L("Delete file","حذف الملف")}</h3><p>${isF?L("This deletes the empty folder.","سيتم حذف المجلد الفارغ."):L("This permanently deletes the file and all its versions. This cannot be undone.","سيتم حذف الملف وجميع إصداراته نهائياً. لا يمكن التراجع.")}</p><p>${L("Type the exact name below to confirm:","اكتب الاسم التالي بالضبط للتأكيد:")}</p><div class="nmb" dir="auto">${esc(i.n)}</div><input id="mi" type="text" dir="auto" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="msg" id="me"></div><div class="mbt"><button class="btn s" id="mc">${L("Cancel","إلغاء")}</button><button class="btn dg" id="mk" disabled>${L("Delete","حذف")}</button></div>`);
 const inp=m.q("#mi"),bt=m.q("#mk"),me=m.q("#me");inp.focus();
 ["paste","drop","contextmenu"].forEach(ev=>inp.addEventListener(ev,e=>e.preventDefault()));
 inp.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="v")e.preventDefault();if(e.key==="Enter"&&!bt.disabled)bt.click()};
 inp.oninput=()=>{bt.disabled=inp.value!==i.n};
 m.q("#mc").onclick=m.close;
 bt.onclick=async()=>{
  if(inp.value!==i.n)return;
  bt.disabled=true;inp.disabled=true;
  try{
   const r=dRef(i),paths=new Set(),subs=[];
   if(!isF){
    if(i.sp)paths.add(i.sp);
    try{(await getDocs(collection(db,"files",i.fid,"versions"))).docs.forEach(v=>{subs.push(v.ref);const p=v.data().storagePath;if(p)paths.add(p)})}catch(e){}
    try{(await getDocs(collection(db,"files",i.fid,"reviews"))).docs.forEach(v=>subs.push(v.ref))}catch(e){}
   }
   await deleteDoc(r);
   m.close();S.sel=null;toast(L("Deleted","تم الحذف"));
   for(const p of paths){try{await deleteObject(sref(storage,p))}catch(e){}}
   for(const s of subs){try{await deleteDoc(s)}catch(e){}}
  }catch(e){bt.disabled=false;inp.disabled=false;me.textContent=e.code==="permission-denied"?L("Not allowed","غير مسموح"):e.message;me.className="msg e"}
 };
}
const ACT={rn:i=>mgr()&&doRename(i),mv:i=>mgr()&&doMove(i),rm:doDelete};

/* row "..." menu (works for files and folders) */
let PM=null;
const closePM=()=>{PM&&PM.remove();PM=null};
document.addEventListener("click",e=>{if(PM&&!e.target.closest(".pm"))closePM()});
function rowMenu(e){
 const b=e.target.closest(".kb");if(!b||!mgr())return;
 e.stopImmediatePropagation();e.preventDefault();
 const i=D.find(x=>x.id===+b.dataset.k);if(!i)return;
 if(PM&&PM.dataset.k===b.dataset.k){closePM();return}closePM();
 const r=b.getBoundingClientRect();
 PM=document.createElement("div");PM.className="pm";PM.dataset.k=b.dataset.k;
 PM.innerHTML=`<button data-a="rn">${L("Rename","إعادة تسمية")}</button><button data-a="mv">${L("Move to folder","نقل إلى مجلد")}</button>${mgr()?`<button class="dg" data-a="rm">${L("Delete","حذف")}</button>`:""}`;
 document.body.appendChild(PM);
 const w=PM.offsetWidth,hh=PM.offsetHeight;
 PM.style.top=Math.min(r.bottom+4,innerHeight-hh-8)+"px";
 PM.style.left=Math.max(8,Math.min(document.dir==="rtl"||document.documentElement.dir==="rtl"?r.left:r.right-w,innerWidth-w-8))+"px";
 PM.onclick=ev=>{const a=ev.target.closest("button")?.dataset.a;if(!a)return;closePM();ACT[a](i)};
}

/* ---- Admin: Users tab (create account + roles) ---- */
const ROLES=["employee","manager","admin"];
const rolLbl=r=>t(r);
async function createAccount(name,email,pw,role){
 const sec=initializeApp(app.options,"sec"+Date.now());
 try{
  const sa=getAuth(sec);
  const c=await createUserWithEmailAndPassword(sa,email,pw);
  try{await setDoc(doc(db,"users",c.user.uid),{name,email,role,active:true,createdAt:serverTimestamp()})}
  catch(e){await c.user.delete().catch(()=>{});throw e}
  await signOut(sa);
 }finally{deleteApp(sec).catch(()=>{})}
}
function renderUsers(){
 S.sel=null;$("#pn").classList.remove("o");
 $("#cr").innerHTML=`<a>${L("Users","المستخدمون")}</a>`;
 $("#ls").innerHTML=`<div class="uw"><div class="uf" id="uf"><h3>${L("Create account","إنشاء حساب")}</h3>
  <label>${L("Name","الاسم")}<input id="un" type="text" autocomplete="off"></label>
  <label>${t("em")}<input id="ue" type="text" dir="ltr" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
  <label>${L("Password (min 8)","كلمة المرور (8 على الأقل)")}<input id="up" type="text" dir="ltr" autocomplete="off" spellcheck="false"></label>
  <label>${t("ro")}<select id="ur">${ROLES.map(r=>`<option value="${r}">${rolLbl(r)}</option>`).join("")}</select></label>
  <button class="btn" id="uc">${L("Create","إنشاء")}</button><div class="msg" id="um"></div></div>
  <div id="ul" class="mu">…</div></div>`;
 const um=$("#um"),say=(m,ok)=>{um.textContent=m;um.className="msg "+(ok?"k":"e")};
 $("#uc").onclick=async()=>{
  const n=$("#un").value.trim(),e=$("#ue").value.trim(),p=$("#up").value,r=$("#ur").value;
  if(!n||!e||!p)return say(L("Fill in all fields","املأ جميع الحقول"));
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return say(L("Invalid email","بريد غير صالح"));
  if(p.length<8)return say(L("Password must be at least 8 characters","كلمة المرور 8 أحرف على الأقل"));
  const b=$("#uc");b.disabled=true;say("");um.className="msg";
  try{
   await createAccount(n,e,p,r);
   ["#un","#ue","#up"].forEach(s=>$(s).value="");
   say(L("Account created. Give the person their email and password.","تم إنشاء الحساب. أعطِ الشخص بريده وكلمة المرور."),1);
   await loadUsers();
  }catch(err){
   const c=err.code||"";
   say(c==="auth/email-already-in-use"?L("This email already has an account","هذا البريد لديه حساب بالفعل"):c==="auth/invalid-email"?L("Invalid email","بريد غير صالح"):c==="auth/weak-password"?L("Password is too weak","كلمة المرور ضعيفة"):c==="permission-denied"?L("Not allowed (check Firestore rules)","غير مسموح (تحقق من قواعد Firestore)"):err.message);
  }
  b.disabled=false;
 };
 loadUsers();
}
async function loadUsers(){
 let docs;
 try{docs=(await getDocs(collection(db,"users"))).docs}catch(e){const el=$("#ul");if(el)el.textContent=e.code==="permission-denied"?L("Not allowed (check Firestore rules)","غير مسموح (تحقق من قواعد Firestore)"):e.message;return}
 const el=$("#ul");if(!el)return;
 const rows=docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
 el.className="";
 el.innerHTML=rows.map(u=>{const me=u.id===uid();return`<div class="ur" data-u="${u.id}"><b class="${u.active===false?"off":""}">${esc(u.name||"—")}${me?` <span class="mu">(${L("you","أنت")})</span>`:""}</b>
  <span class="mu ${u.active===false?"off":""}" dir="ltr">${esc(u.email||"—")}</span>
  <select data-r ${me?"disabled":""}>${ROLES.map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${rolLbl(r)}</option>`).join("")}</select>
  <span class="acts">${u.email?`<button data-x="rs">${L("Reset password","إعادة تعيين كلمة المرور")}</button>`:""}${me?"":`<button data-x="ac">${u.active===false?L("Enable","تفعيل"):L("Disable","تعطيل")}</button>`}</span></div>`}).join("")||`<div class="empty">—</div>`;
 el.onchange=async e=>{const s=e.target.closest("select[data-r]");if(!s)return;const id=s.closest(".ur").dataset.u;
  try{await updateDoc(doc(db,"users",id),{role:s.value});toast(L("Role updated","تم تحديث الدور"))}catch(err){fail(err);loadUsers()}};
 el.onclick=async e=>{const b=e.target.closest("button[data-x]");if(!b)return;const row=b.closest(".ur"),id=row.dataset.u,u=rows.find(x=>x.id===id);
  try{
   if(b.dataset.x==="ac"){await updateDoc(doc(db,"users",id),{active:u.active===false});loadUsers()}
   if(b.dataset.x==="rs"){await sendPasswordResetEmail(auth,u.email);toast(L("Reset link sent","تم إرسال رابط إعادة التعيين"))}
  }catch(err){fail(err)}};
}
</script></body></html>
